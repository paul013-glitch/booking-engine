<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Confirmed | Campify</title>
    <meta name="description" content="Your surf camp booking has been confirmed." />
    <script>
      (function () {
        const base = window.location.protocol === "file:" ? "./" : "/";
        document.write('<link rel="stylesheet" href="' + base + 'styles.css" />');
      })();
    </script>
  </head>
  <body class="page page-book">
    <main class="booking-shell" style="min-height: 100vh; align-items: center;">
      <section class="panel" style="max-width: 620px; width: 100%; margin: 0 auto;">
        <p class="eyebrow">Booking confirmed</p>
        <h1 style="margin-bottom: 12px;">Please check your email for the confirmation.</h1>
        <p class="lede" style="margin-bottom: 18px;">
          Your reservation has been saved. We’ve sent the details to your inbox, including the next steps.
        </p>
        <div class="confirmation-card">
          <div class="summary-item" style="padding-bottom: 0; border-bottom: 0;">
            <div>
              <strong>Reservation number</strong>
              <span id="reservationCode">Loading...</span>
            </div>
            <strong id="confirmationStatus">Confirming...</strong>
          </div>
          <p id="confirmationDetail" class="helper" style="margin-top: 14px;">Checking payment status with Stripe.</p>
        </div>
        <div class="booking-actions" style="justify-content: space-between; margin-top: 20px;">
          <a class="button button-secondary" href="./index.html">Back home</a>
          <a class="button button-primary" href="./book.html?camp=amigos-surf-camp">View demo booking</a>
        </div>
      </section>
    </main>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const reservation = params.get("reservation") || "Pending";
        const email = params.get("email") || "";
        const workspace = params.get("workspace") || "";
        const sessionId = params.get("session_id") || "";
        const reservationCode = document.getElementById("reservationCode");
        const confirmationStatus = document.getElementById("confirmationStatus");
        const confirmationDetail = document.getElementById("confirmationDetail");

        if (reservationCode) reservationCode.textContent = reservation;

        function setStatus(title, detail) {
          if (confirmationStatus) confirmationStatus.textContent = title;
          if (confirmationDetail) confirmationDetail.textContent = detail;
        }

        if (!sessionId || !workspace) {
          setStatus("Saved", email ? `Reservation saved for ${email}. Payment confirmation may still be processing.` : "Reservation saved.");
          return;
        }

        fetch("/.netlify/functions/reconcile-stripe-checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            workspaceId: workspace,
            sessionId,
            reservationCode: reservation,
          }),
        })
          .then(async (response) => {
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || `Payment check failed (${response.status})`);
            const booking = data.booking || {};
            const amountPaid = Number(booking.amountPaid || 0);
            const amountDue = Number(booking.amountDue || 0);
            setStatus(
              booking.paymentStatus === "paid" ? "Paid" : "Deposit paid",
              `Payment confirmed. Paid €${amountPaid.toLocaleString("en-US", { maximumFractionDigits: 0 })}. Remaining due €${amountDue.toLocaleString("en-US", { maximumFractionDigits: 0 })}.`,
            );
          })
          .catch((error) => {
            setStatus(
              "Payment processing",
              `${error instanceof Error ? error.message : "Stripe is still processing the payment."} Your reservation number is saved. If this does not update, contact the host with reservation ${reservation}.`,
            );
          });
      })();
    </script>
  </body>
</html>
